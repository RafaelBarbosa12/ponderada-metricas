# Variante sequencial: test só após lint (comparação de paralelismo)
name: CI/CD Métricas (sequencial)

on:
  push:
    branches: [main]
    paths:
      - ".sequential-marker"
  workflow_dispatch:
    inputs:
      experiment_variation:
        description: "Rótulo da variação"
        required: true
        default: "sequential-dispatch"
      cache_enabled:
        type: boolean
        default: true
      expand_tests:
        type: boolean
        default: false
      run_slow_tests:
        type: boolean
        default: false
      intentional_fail:
        type: boolean
        default: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Carregar experiment-config.json
        run: python3 scripts/load_experiment_config.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        if: env.CACHE_ENABLED == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-seq-${{ hashFiles('requirements-dev.txt') }}

      - name: Instalar e lint
        run: |
          pip install -r requirements-dev.txt -q
          ruff check src tests

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Carregar experiment-config.json
        run: python3 scripts/load_experiment_config.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        if: env.CACHE_ENABLED == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-seq-${{ hashFiles('requirements-dev.txt') }}

      - name: Executar testes
        id: pytest
        run: |
          pip install -r requirements-dev.txt -q
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --timeout=30
        continue-on-error: ${{ env.INTENTIONAL_FAIL == '1' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: reports/

  collect-metrics:
    name: collect-metrics
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Carregar experiment-config.json
        run: python3 scripts/load_experiment_config.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-results-*
          merge-multiple: true
          path: reports

      - run: echo "COMMIT_MESSAGE=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - run: pip install -r requirements-dev.txt -q

      - name: Gravar métricas
        if: always()
        run: python scripts/record_pipeline_metrics.py
        env:
          JUNIT_PATH: reports/junit.xml
          METRICS_DIR: artifacts/metrics
          JOB_STATUS: ${{ needs.test.result }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-metrics-${{ github.run_id }}
          path: artifacts/metrics/
